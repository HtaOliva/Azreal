name: CI/CD Pipeline - Fullstack Quality, Supply Chain & Security Gates

on:
  push:
    branches:
      - development
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: write
  security-events: write

jobs:
  # =========================================================================
  # 1. PHASE 1: LINT & AUTOMATED TESTS (Unit, Architecture & Coverage)
  # =========================================================================
  test:
    name: 🧪 Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 21 LTS (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: 📦 Setup Node.js 22 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: 🔍 Backend - Lint (Checkstyle) & Validation
        run: |
          echo "Executando análise de linting no código Java com Checkstyle..."
          mvn -B checkstyle:check -f backend/pom.xml

      - name: 🏗️ Backend - Build & Run Tests with JaCoCo Coverage
        run: |
          echo "Executando testes automatizados do Spring Boot 3 e gerando relatório JaCoCo..."
          mvn -B clean test jacoco:report -f backend/pom.xml

      - name: 🔍 Frontend - Install Dependencies & Run Lint (ESLint)
        working-directory: ./frontend
        run: |
          npm ci || npm install
          echo "Executando linting no Angular 22 com ESLint..."
          npm run lint --if-present

      - name: 🎨 Frontend - Run Unit Tests (Vitest)
        working-directory: ./frontend
        run: |
          echo "Executando testes unitários do Angular 22 com Vitest..."
          npm run test:coverage --if-present || npm run test --if-present

      - name: 📤 Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/jacoco.xml
          retention-days: 7

      - name: 📦 Package Backend JAR for DAST
        run: |
          mvn -B package -DskipTests -f backend/pom.xml

      - name: 📤 Upload Backend JAR Artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 1

  # =========================================================================
  # 2. PHASE 2A: SAST (Static Application Security Testing - Semgrep)
  #    Falha o job se houver achados de severidade ERROR.
  #    O SARIF é sempre enviado ao GitHub (aba Security), mesmo com falha.
  # =========================================================================
  sast-semgrep:
    name: 🔒 SAST - Semgrep Security Audit
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install Semgrep
        run: pip install semgrep

      - name: 🛡️ Run Semgrep SAST Scan (OWASP Top 10 & Security Rules)
        run: |
          semgrep scan \
            --config "p/security-audit" \
            --config "p/owasp-top-ten" \
            --config "p/java" \
            --config "p/typescript" \
            --severity ERROR \
            --error \
            --sarif --output semgrep.sarif

      - name: 📤 Upload Semgrep SARIF Results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # =========================================================================
  # 3. PHASE 2B: SECRET SCANNING (Gitleaks)
  #    Agora bloqueante: se vazar segredo, o pipeline falha.
  # =========================================================================
  secret-scanning:
    name: 🔑 Secret Leak Detection (Gitleaks)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔍 Scan for Leaked Secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # 4. PHASE 2C: SUPPLY CHAIN SECURITY (SBOM with Syft & CVEs with Grype)
  #    Falha se houver vulnerabilidade CRÍTICA nas dependências.
  # =========================================================================
  supply-chain:
    name: 📦 Supply Chain - Syft (SBOM) & Grype (CVEs)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 📜 Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: 🔍 Scan SBOM & Dependencies for Vulnerabilities with Grype
        id: grype
        uses: anchore/scan-action@v6
        with:
          path: '.'
          fail-build: true
          severity-cutoff: critical
          output-format: sarif

      - name: 📤 Upload SBOM Artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 7

      - name: 📤 Upload Grype SARIF Results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.grype.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
        continue-on-error: true

  # =========================================================================
  # 5. PHASE 3: SONARQUBE ANALYSIS & QUALITY GATE ENFORCEMENT
  #    Requer os segredos SONAR_TOKEN e SONAR_HOST_URL.
  #    Falha se os segredos faltarem ou se o Quality Gate for reprovado.
  # =========================================================================
  sonar:
    name: 🛡️ SonarQube Quality Gate
    needs: [test, sast-semgrep, secret-scanning, supply-chain]
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 21 LTS
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: 📥 Download JaCoCo Coverage Artifact
        uses: actions/download-artifact@v8
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco

      - name: 🏗️ Compile Backend for SonarQube
        run: |
          mvn -B -DskipTests compile -f backend/pom.xml

      - name: 🔍 Run SonarQube Scanner & Wait for Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonar.fchicout.dev' }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN não configurado nos segredos do repositório."
            exit 1
          fi

          echo "Iniciando análise estática e verificação do Quality Gate no SonarQube..."
          # Roda a partir do pom.xml da raiz: ele já define sonar.projectKey e a versão do plugin.
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectName=azreal-backend \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.java.binaries="target/classes" \
            -Dsonar.coverage.jacoco.xmlReportPaths="${GITHUB_WORKSPACE}/backend/target/site/jacoco/jacoco.xml" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

  # =========================================================================
  # 5B. PHASE 3B: SONARQUBE ANALYSIS & QUALITY GATE - FRONTEND (Angular)
  #     Requer o segredo AZREAL_FRONTEND (token do projeto azreal-frontend).
  # =========================================================================
  sonar-frontend:
    name: 🛡️ SonarQube Quality Gate (Frontend)
    needs: [test, sast-semgrep, secret-scanning, supply-chain]
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 📦 Setup Node.js 22 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: 🎨 Frontend - Install Dependencies & Generate Coverage
        working-directory: ./frontend
        run: |
          npm ci || npm install
          npm run test:coverage --if-present || npm run test --if-present

      - name: 🔍 Run SonarQube Scanner (Frontend) & Wait for Quality Gate
        working-directory: ./frontend
        env:
          SONAR_TOKEN: ${{ secrets.AZREAL_FRONTEND }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonar.fchicout.dev' }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::AZREAL_FRONTEND não configurado nos segredos do repositório."
            exit 1
          fi

          npx --yes @sonar/scan \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.projectKey=azreal-frontend \
            -Dsonar.projectName=azreal-frontend \
            -Dsonar.sources=src \
            -Dsonar.tests=src \
            -Dsonar.test.inclusions="**/*.spec.ts" \
            -Dsonar.exclusions="**/node_modules/**,**/*.spec.ts" \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

  # =========================================================================
  # 6. PHASE 4A: DAST FOR DEVELOPMENT/STAGING (ProjectDiscovery Nuclei)
  #    Informativo: não bloqueia o pipeline (continue-on-error).
  # =========================================================================
  dast-development-nuclei:
    name: ⚡ DAST Staging - Nuclei Scanner
    needs: [sonar, sonar-frontend]
    if: github.ref == 'refs/heads/development' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: ☕ Setup Java 21 LTS
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📥 Download Backend JAR
        uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: target

      - name: 🚀 Start Backend API for Nuclei Scan
        run: |
          JAR_FILE=$(ls target/*.jar | head -n 1)
          echo "Iniciando backend API em background: $JAR_FILE"
          java -jar "$JAR_FILE" > backend-runtime.log 2>&1 &
          echo "Aguardando endpoint de healthcheck subir..."
          timeout 60 bash -c 'until curl -s http://localhost:8080/api/v1/health | grep -q "UP"; do sleep 2; done'
          echo "✅ Backend API está UP e pronto para análise Nuclei!"

      - name: 🎯 Execute Nuclei DAST Scan (Vulnerabilities, Misconfigurations & API Flaws)
        uses: projectdiscovery/nuclei-action@v3
        with:
          cache: false
          args: '-u http://localhost:8080 -tags cve,misconfig,exposure,tech -severity critical,high,medium -silent'
        continue-on-error: true

  # =========================================================================
  # 7. PHASE 4B: DAST FOR PRODUCTION/MAIN (OWASP ZAP Baseline Scan)
  #    Informativo: não bloqueia o pipeline (continue-on-error).
  # =========================================================================
  dast-production-zap:
    name: 🛡️ DAST Production - OWASP ZAP Scan
    needs: [sonar, sonar-frontend]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: ☕ Setup Java 21 LTS
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📥 Download Backend JAR
        uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: target

      - name: 🚀 Start Backend API for OWASP ZAP Scan
        run: |
          JAR_FILE=$(ls target/*.jar | head -n 1)
          echo "Iniciando backend API em background: $JAR_FILE"
          java -jar "$JAR_FILE" > backend-runtime.log 2>&1 &
          echo "Aguardando endpoint de healthcheck subir..."
          timeout 60 bash -c 'until curl -s http://localhost:8080/api/v1/health | grep -q "UP"; do sleep 2; done'
          echo "✅ Backend API está UP e pronto para o OWASP ZAP scan!"

      - name: 🕷️ Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:8080/api/v1/health'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: false
          fail_action: false
        continue-on-error: true

  # =========================================================================
  # 8. PHASE 5A: DEPLOY STAGING (Triggered on development branch)
  # =========================================================================
  deploy-staging:
    name: 🚀 Deploy Staging Environment
    needs: [dast-development-nuclei]
    if: github.ref == 'refs/heads/development' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 📦 Packaging Staging Artifacts
        run: |
          echo "=================================================================================="
          echo "📦 Testes, Lint, SAST, Gitleaks, Supply Chain, SonarQube e DAST (Nuclei) concluídos!"
          echo "Disparando deploy para o ambiente de STAGING..."
          echo "Branch: development (Commit: ${{ github.sha }})"
          echo "=================================================================================="

      - name: 🚢 Staging Deploy Hook
        run: |
          echo "✅ Deploy em Staging finalizado com sucesso."

  # =========================================================================
  # 9. PHASE 5B: DEPLOY PRODUCTION (Triggered on main branch / release tags)
  # =========================================================================
  deploy-production:
    name: 🏆 Deploy Production Environment
    needs: [dast-production-zap]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 📦 Packaging Production Release
        run: |
          echo "=================================================================================="
          echo "🏆 Quality, Gitleaks, Supply Chain & DAST (OWASP ZAP) concluídos para PRODUÇÃO!"
          echo "Branch: main (Release Commit: ${{ github.sha }})"
          echo "=================================================================================="

      - name: 🚢 Production Deploy Hook
        run: |
          echo "✅ Deploy em Produção finalizado com sucesso."
