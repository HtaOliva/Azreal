spring:
  application:
    name: fullstack-api
  datasource:
    url: jdbc:postgresql://db.nulgjxgkykjmjloognzw.supabase.co:5432/postgres?sslmode=require
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  ldap:
    urls: ${LLDAP_URL:ldap://localhost:389}
    base: ${LLDAP_BASE_DN:dc=example,dc=com}
    username: ${LLDAP_BIND_DN:}
    password: ${LLDAP_BIND_PASSWORD:}
logging:
  level:
    root: INFO
    com.zaxxer.hikari: DEBUG
    org.springframework.jdbc: DEBUG
server:
  port: 8080

app:
  environment: development
  ldap:
    admin-group: ${LLDAP_ADMIN_GROUP:azrael_admin}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
