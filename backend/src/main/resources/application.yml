spring:
  application:
    name: fullstack-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://db.nulgjxgkykjmjloognzw.supabase.co:5432/postgres?sslmode=require}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
  ldap:
    urls: ${LLDAP_URL:ldap://localhost:389}
    base: ${LLDAP_BASE_DN:dc=example,dc=com}
    username: ${LLDAP_BIND_DN:}
    password: ${LLDAP_BIND_PASSWORD:}
logging:
  level:
    root: INFO
    com.zaxxer.hikari: ${HIKARI_LOG_LEVEL:DEBUG}
    org.springframework.jdbc: ${JDBC_LOG_LEVEL:DEBUG}
server:
  port: ${PORT:8080}

app:
  environment: development
  ldap:
    admin-group: ${LLDAP_ADMIN_GROUP:azrael_admin}
  ai:
    enabled: ${AI_ENABLED:false}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gemini-flash-latest}
    base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    timeout-ms: ${AI_TIMEOUT_MS:5000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
