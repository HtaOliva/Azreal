spring:
  application:
    name: fullstack-api
  datasource:
    url: jdbc:postgresql://db.nulgjxgkykjmjloognzw.supabase.co:5432/postgres?sslmode=require
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
logging:
  level:
    root: INFO
    com.zaxxer.hikari: DEBUG
    org.springframework.jdbc: DEBUG
server:
  port: 8080

app:
  environment: development

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
