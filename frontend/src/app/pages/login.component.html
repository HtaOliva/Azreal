<div class="auth-wrapper">
  <h1 class="auth-hero-title">AZREAL</h1>
  <p class="auth-hero-sub">Matchmaking estruturado entre Startups early stage e Ambientes de Validação</p>

  <div class="card auth-card">
    <h2 style="font-size: 18px; font-weight: 700; color: var(--color-secondary); margin-bottom: 18px;">
      Acesse sua conta
    </h2>

    <form (ngSubmit)="onLoginSubmit()">
      <div class="form-group">
        <label class="form-label" for="loginEmail">E-mail</label>
        <input
          id="loginEmail"
          name="email"
          type="email"
          class="form-control"
          placeholder="contato@techpulse.com.br"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPassword">Senha</label>
        <input
          id="loginPassword"
          name="password"
          type="password"
          class="form-control"
          placeholder="••••••••••••"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          required
        />
      </div>

      <div class="form-group">
        <span class="form-label">Tipo de Acesso:</span>
        <div class="role-selector-grid">
          <label class="role-option" [class.selected]="accessRole() === 'startup'">
            <input
              type="radio"
              name="accessRole"
              value="startup"
              [checked]="accessRole() === 'startup'"
              (change)="accessRole.set('startup')"
            />
            <span>Startup</span>
          </label>
          <label class="role-option" [class.selected]="accessRole() === 'ambiente'">
            <input
              type="radio"
              name="accessRole"
              value="ambiente"
              [checked]="accessRole() === 'ambiente'"
              (change)="accessRole.set('ambiente')"
            />
            <span>Ambiente de Validação</span>
          </label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 6px;" [disabled]="submitting()">
        {{ submitting() ? 'ENTRANDO...' : 'ENTRAR' }}
      </button>

      <hr class="auth-divider" />

      <p style="font-size: 13px; font-weight: 600; color: var(--color-text-main);">Novo por aqui?</p>
      <div class="register-buttons-grid">
        <button type="button" class="btn btn-secondary" (click)="openModal('startup')">
          Cadastrar Startup
        </button>
        <button type="button" class="btn btn-outline" (click)="openModal('ambiente')">
          Cadastrar Ambiente de Validação
        </button>
      </div>

      <label class="lgpd-check-row" for="lgpdCheck">
        <input
          id="lgpdCheck"
          name="lgpd"
          type="checkbox"
          style="margin-top: 3px;"
          [ngModel]="lgpdAccepted()"
          (ngModelChange)="lgpdAccepted.set($event)"
        />
        <span>
          Li e aceito os <strong>Termos de Uso e Política de Privacidade (LGPD)</strong>, incluindo privacidade em camadas e uso ético de IA no matchmaking.
        </span>
      </label>
    </form>
  </div>
</div>

<!-- Modal Cadastro Startup -->
<div class="modal-backdrop" [class.open]="activeModal() === 'startup'">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalStartupTitle">
    <div class="modal-header">
      <h3 id="modalStartupTitle" class="modal-title">Cadastrar Startup (RF01 / RF02)</h3>
      <button type="button" class="modal-close" aria-label="Fechar" (click)="closeModal()">X</button>
    </div>
    <form (ngSubmit)="onRegisterStartup()">
      <div class="form-group">
        <label class="form-label" for="regStartupNome">Nome da Startup</label>
        <input
          id="regStartupNome"
          name="startupNome"
          type="text"
          class="form-control"
          required
          placeholder="Ex: TechPulse Soluções"
          [ngModel]="startupNome()"
          (ngModelChange)="startupNome.set($event)"
        />
      </div>
      <div class="form-group">
        <label class="form-label" for="regStartupEmail">E-mail de Acesso</label>
        <input
          id="regStartupEmail"
          name="startupEmail"
          type="email"
          class="form-control"
          required
          placeholder="contato@techpulse.com.br"
          [ngModel]="startupEmail()"
          (ngModelChange)="startupEmail.set($event)"
        />
      </div>
      <div class="form-group">
        <label class="form-label" for="regStartupSenha">Senha (mín. 6 caracteres)</label>
        <input
          id="regStartupSenha"
          name="startupSenha"
          type="password"
          class="form-control"
          required
          minlength="6"
          [ngModel]="startupSenha()"
          (ngModelChange)="startupSenha.set($event)"
        />
      </div>
      <div class="form-group">
        <label class="form-label" for="regStartupEstagio">Estágio do Protótipo</label>
        <select
          id="regStartupEstagio"
          name="startupEstagio"
          class="form-control"
          [ngModel]="startupEstagio()"
          (ngModelChange)="startupEstagio.set($event)"
        >
          <option value="MVP_FUNCIONAL">MVP Funcional</option>
          <option value="PROTOTIPO_INICIAL">Protótipo Inicial</option>
          <option value="EM_TESTE">Em Teste Piloto</option>
          <option value="IDEACAO">Ideação</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="regStartupValidacao">O que precisa validar em ambiente real?</label>
        <textarea
          id="regStartupValidacao"
          name="startupValidacao"
          class="form-control"
          rows="3"
          required
          placeholder="Descreva sua solução e hipótese de validação..."
          [ngModel]="startupValidacao()"
          (ngModelChange)="startupValidacao.set($event)"
        ></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" (click)="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="registering()">
          {{ registering() ? 'Cadastrando...' : 'Concluir Cadastro' }}
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Modal Cadastro Ambiente -->
<div class="modal-backdrop" [class.open]="activeModal() === 'ambiente'">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalAmbienteTitle">
    <div class="modal-header">
      <h3 id="modalAmbienteTitle" class="modal-title">Cadastrar Ambiente de Validação (RF03)</h3>
      <button type="button" class="modal-close" aria-label="Fechar" (click)="closeModal()">X</button>
    </div>
    <form (ngSubmit)="onRegisterAmbiente()">
      <div class="form-group">
        <label class="form-label" for="regAmbienteRazao">Razão Social (Oculto até o aceite)</label>
        <input
          id="regAmbienteRazao"
          name="ambienteRazaoSocial"
          type="text"
          class="form-control"
          required
          placeholder="Ex: Supermercados Nova Era Ltda"
          [ngModel]="ambienteRazaoSocial()"
          (ngModelChange)="ambienteRazaoSocial.set($event)"
        />
      </div>
      <div class="form-group">
        <label class="form-label" for="regAmbienteFantasia">Nome Fantasia</label>
        <input
          id="regAmbienteFantasia"
          name="ambienteNomeFantasia"
          type="text"
          class="form-control"
          placeholder="Ex: Nova Era Varejo"
          [ngModel]="ambienteNomeFantasia()"
          (ngModelChange)="ambienteNomeFantasia.set($event)"
        />
      </div>
      <div class="form-group">
        <label class="form-label" for="regAmbienteSetor">Setor de Atuação</label>
        <input
          id="regAmbienteSetor"
          name="ambienteSetor"
          type="text"
          class="form-control"
          required
          placeholder="Ex: Varejo"
          [ngModel]="ambienteSetor()"
          (ngModelChange)="ambienteSetor.set($event)"
        />
      </div>
      <div class="form-group">
        <label class="form-label" for="regAmbientePorte">Porte da Organização</label>
        <select
          id="regAmbientePorte"
          name="ambientePorte"
          class="form-control"
          [ngModel]="ambientePorte()"
          (ngModelChange)="ambientePorte.set($event)"
        >
          <option value="PEQUENO">Pequeno Porte</option>
          <option value="MEDIO">Médio Porte</option>
          <option value="GRANDE">Grande Porte</option>
          <option value="ORGAO_PUBLICO">Órgão Público</option>
          <option value="INSTITUICAO_ENSINO_SAUDE">Instituição de Ensino / Saúde</option>
          <option value="COMUNIDADE">Comunidade</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="regAmbienteEmail">E-mail de Contato</label>
        <input
          id="regAmbienteEmail"
          name="ambienteEmail"
          type="email"
          class="form-control"
          required
          placeholder="inovacao@novaera.com.br"
          [ngModel]="ambienteEmail()"
          (ngModelChange)="ambienteEmail.set($event)"
        />
      </div>
      <div class="form-group">
        <label class="form-label" for="regAmbienteSenha">Senha (mín. 6 caracteres)</label>
        <input
          id="regAmbienteSenha"
          name="ambienteSenha"
          type="password"
          class="form-control"
          required
          minlength="6"
          [ngModel]="ambienteSenha()"
          (ngModelChange)="ambienteSenha.set($event)"
        />
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" (click)="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="registering()">
          {{ registering() ? 'Cadastrando...' : 'Concluir Cadastro' }}
        </button>
      </div>
    </form>
  </div>
</div>
